name: chart checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.4
      - name: lint and render
        shell: bash
        run: |
          set -euo pipefail
          for chart in database web-app worker; do
            helm lint "charts/$chart"
            helm template "$chart" "charts/$chart" > /dev/null
            for env in staging production; do
              helm lint "charts/$chart" -f "charts/$chart/values-$env.yaml"
              helm template "$chart" "charts/$chart" -n "$env" -f "charts/$chart/values-$env.yaml" > /dev/null
            done
          done
